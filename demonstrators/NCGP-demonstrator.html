  return {"hist_phase": hist_phase, "reform_phase": reform_phase, "fellowship_hist": fellowship_hist, "fellowship_share_eff": fellowship_share_eff, "NCGP_budget_eff": NCGP_budget_eff, "indig_share_eff": indig_share_eff, "schemes_eff": schemes_eff, "annual_project_cost": annual_project_cost, "Administrative_burden": Administrative_burden, "Effective_research_time": Effective_research_time, "effective_researchers": effective_researchers, "Available_researcher_capacity": Available_researcher_capacity, "Mentoring_capacity": Mentoring_capacity, "Mid_career_precarity": Mid_career_precarity, "Attrition_pressure": Attrition_pressure, "Funding_concentration": Funding_concentration, "dispersal_quality": dispersal_quality, "Project_funding_pool": Project_funding_pool, "funding_slack_projects": funding_slack_projects, "Peer_review_turnaround": Peer_review_turnaround, "throughput_factor": throughput_factor, "quality_factor": quality_factor, "total_researchers": total_researchers, "ecr_share": ecr_share, "mcr_share": mcr_share, "scr_share": scr_share, "economic_return": economic_return};
}

function deriv(S, P, t) {
  const hist_start = P["hist_start"];
  const hist_end = P["hist_end"];
  const reform_year = P["reform_year"];
  const reform_ramp = P["reform_ramp"];
  const fellowship_2010 = P["fellowship_2010"];
  const fellowship_2024 = P["fellowship_2024"];
  const fellowship_reform_target = P["fellowship_reform_target"];
  const ncgp_budget_2010 = P["ncgp_budget_2010"];
  const ncgp_budget_2024 = P["ncgp_budget_2024"];
  const indig_share_base = P["indig_share_base"];
  const indig_share_reform_target = P["indig_share_reform_target"];
  const schemes_base = P["schemes_base"];
  const schemes_reform_target = P["schemes_reform_target"];
  const fellowship_removal = P["fellowship_removal"];
  const indigenous_boost = P["indigenous_boost"];
  const scheme_simplification = P["scheme_simplification"];
  const initiate_boost = P["initiate_boost"];
  const initiate_ecr_intake = P["initiate_ecr_intake"];
  const initiate_retention_effect = P["initiate_retention_effect"];
  const lead_mentor_boost = P["lead_mentor_boost"];
  const lead_mentor_capacity = P["lead_mentor_capacity"];
  const lead_mentor_senior_retention = P["lead_mentor_senior_retention"];
  const lead_mentor_hdr = P["lead_mentor_hdr"];
  const phd_per_mentoring = P["phd_per_mentoring"];
  const hdr_per_project = P["hdr_per_project"];
  const external_phd_supply = P["external_phd_supply"];
  const phd_duration = P["phd_duration"];
  const phd_to_ecr_fraction = P["phd_to_ecr_fraction"];
  const ecr_duration = P["ecr_duration"];
  const mcr_duration = P["mcr_duration"];
  const base_attrition_fraction = P["base_attrition_fraction"];
  const retirement_fraction = P["retirement_fraction"];
  const avg_project_duration = P["avg_project_duration"];
  const grant_adjust_time = P["grant_adjust_time"];
  const indig_from_funding = P["indig_from_funding"];
  const ecr_salary = P["ecr_salary"];
  const indig_mentoring_gain = P["indig_mentoring_gain"];
  const indig_capacity_ceiling = P["indig_capacity_ceiling"];
  const indig_attrition = P["indig_attrition"];
  const track_gain_per_impact = P["track_gain_per_impact"];
  const track_decay = P["track_decay"];
  const impact_per_project = P["impact_per_project"];
  const impact_decay = P["impact_decay"];
  const roi_per_impact = P["roi_per_impact"];
  const base_cost_inflation = P["base_cost_inflation"];
  const concentration_cost_sensitivity = P["concentration_cost_sensitivity"];
  const collab_gain = P["collab_gain"];
  const impact_ref = P["impact_ref"];
  const partner_pool = P["partner_pool"];
  const partner_ref = P["partner_ref"];
  const collab_decay = P["collab_decay"];
  const cocontribution_rate = P["cocontribution_rate"];
  const admin_per_scheme = P["admin_per_scheme"];
  const admin_per_project = P["admin_per_project"];
  const research_time_loss_per_burden = P["research_time_loss_per_burden"];
  const ecr_capacity_weight = P["ecr_capacity_weight"];
  const researchers_per_project = P["researchers_per_project"];
  const mentor_per_senior = P["mentor_per_senior"];
  const mentor_per_mcr = P["mentor_per_mcr"];
  const precarity_base = P["precarity_base"];
  const precarity_fellowship_sens = P["precarity_fellowship_sens"];
  const fellowship_ref = P["fellowship_ref"];
  const precarity_opportunity_sens = P["precarity_opportunity_sens"];
  const projects_ref = P["projects_ref"];
  const precarity_attrition_sens = P["precarity_attrition_sens"];
  const pull_sens = P["pull_sens"];
  const external_labour_pull = P["external_labour_pull"];
  const congestion_sens = P["congestion_sens"];
  const mcr_congestion_ref = P["mcr_congestion_ref"];
  const concentration_base = P["concentration_base"];
  const concentration_track_sens = P["concentration_track_sens"];
  const track_ref = P["track_ref"];
  const concentration_dispersal_sens = P["concentration_dispersal_sens"];
  const dispersal_output_elasticity = P["dispersal_output_elasticity"];
  const reserve_share = P["reserve_share"];
  const turnaround_base = P["turnaround_base"];
  const turnaround_load_sens = P["turnaround_load_sens"];
  const review_capacity = P["review_capacity"];
  const turnaround_sens = P["turnaround_sens"];
  const track_quality_gain = P["track_quality_gain"];
  const PhD_pipeline = S["PhD_pipeline"];
  const ECR_researchers = S["ECR_researchers"];
  const MCR_researchers = S["MCR_researchers"];
  const SCR_researchers = S["SCR_researchers"];
  const Active_projects = S["Active_projects"];
  const Indigenous_researchers = S["Indigenous_researchers"];
  const Track_record = S["Track_record"];
  const Knowledge_impact = S["Knowledge_impact"];
  const Avg_project_cost = S["Avg_project_cost"];
  const Collaboration_intensity = S["Collaboration_intensity"];
  const TIME = t;
  const hist_phase = (CLIP((TIME - hist_start)/(hist_end - hist_start), 0, 1));
  const reform_phase = (CLIP((TIME - reform_year)/reform_ramp, 0, 1));
  const fellowship_hist = (fellowship_2010 + (fellowship_2024 - fellowship_2010)*hist_phase);
  const fellowship_share_eff = (fellowship_hist + (fellowship_reform_target - fellowship_hist)*fellowship_removal*reform_phase);
  const NCGP_budget_eff = (ncgp_budget_2010 + (ncgp_budget_2024 - ncgp_budget_2010)*hist_phase);
  const indig_share_eff = (indig_share_base + (indig_share_reform_target - indig_share_base)*indigenous_boost*reform_phase);
  const schemes_eff = (schemes_base + (schemes_reform_target - schemes_base)*scheme_simplification*reform_phase);
  const annual_project_cost = (Avg_project_cost/avg_project_duration);
  const Administrative_burden = (admin_per_scheme*schemes_eff + admin_per_project*Active_projects);
  const Effective_research_time = (MAX(0.2, 1 - research_time_loss_per_burden*Administrative_burden));
  const effective_researchers = ((ECR_researchers*ecr_capacity_weight + MCR_researchers + SCR_researchers + Indigenous_researchers)*Effective_research_time);
  const Available_researcher_capacity = (effective_researchers/researchers_per_project - Active_projects);
  const Mentoring_capacity = (mentor_per_senior*SCR_researchers + mentor_per_mcr*MCR_researchers + lead_mentor_boost*lead_mentor_capacity*reform_phase);
  const Mid_career_precarity = (MAX(0, precarity_base + precarity_fellowship_sens*(1 - fellowship_share_eff/fellowship_ref) - precarity_opportunity_sens*(Active_projects/projects_ref)));
  const Attrition_pressure = (1 + precarity_attrition_sens*Mid_career_precarity + pull_sens*external_labour_pull + congestion_sens*(MCR_researchers/mcr_congestion_ref));
  const Funding_concentration = (MAX(0, MIN(1, concentration_base + concentration_track_sens*(Track_record/track_ref) - concentration_dispersal_sens*(Active_projects/projects_ref))));
  const dispersal_quality = (1 + dispersal_output_elasticity*(0.5 - Funding_concentration));
  const Project_funding_pool = (NCGP_budget_eff*(1 - fellowship_share_eff - indig_share_eff - reserve_share) + cocontribution_rate*Collaboration_intensity*NCGP_budget_eff - Active_projects*annual_project_cost);
  const funding_slack_projects = (Project_funding_pool/annual_project_cost);
  const Peer_review_turnaround = (turnaround_base*(1 + turnaround_load_sens*(Active_projects/review_capacity)));
  const throughput_factor = (1/(1 + turnaround_sens*Peer_review_turnaround));
  const quality_factor = (1 + track_quality_gain*(Track_record/track_ref - 1));
  const total_researchers = (ECR_researchers + MCR_researchers + SCR_researchers);
  const ecr_share = (ECR_researchers/MAX(1, total_researchers));
  const mcr_share = (MCR_researchers/MAX(1, total_researchers));
  const scr_share = (SCR_researchers/MAX(1, total_researchers));
  const economic_return = (Knowledge_impact*roi_per_impact);
  const phd_intake = (phd_per_mentoring*Mentoring_capacity + hdr_per_project*Active_projects + external_phd_supply + lead_mentor_boost*lead_mentor_hdr*reform_phase);
  const phd_graduation = (PhD_pipeline/phd_duration);
  const ecr_recruit = ((PhD_pipeline/phd_duration)*phd_to_ecr_fraction);
  const initiate_intake = (initiate_boost*initiate_ecr_intake*reform_phase);
  const ecr_to_mcr = (ECR_researchers/ecr_duration);
  const ecr_exit = (ECR_researchers*base_attrition_fraction*Attrition_pressure*(1 - initiate_boost*initiate_retention_effect*reform_phase));
  const mcr_to_scr = (MCR_researchers/mcr_duration);
  const mcr_exit = (MCR_researchers*base_attrition_fraction*Attrition_pressure*(1 - lead_mentor_boost*lead_mentor_senior_retention*reform_phase));
  const scr_exit = (SCR_researchers*(base_attrition_fraction*Attrition_pressure + retirement_fraction)*(1 - lead_mentor_boost*lead_mentor_senior_retention*reform_phase));
  const new_grants = (MAX(0, Active_projects/avg_project_duration + MIN(funding_slack_projects, Available_researcher_capacity)/grant_adjust_time)*throughput_factor*quality_factor);
  const project_completion = (Active_projects/avg_project_duration);
  const indig_build = (indig_from_funding*(indig_share_eff*NCGP_budget_eff/ecr_salary) + indig_mentoring_gain*Indigenous_researchers*(1 - Indigenous_researchers/indig_capacity_ceiling));
  const indig_exit = (Indigenous_researchers*indig_attrition);
  const track_gain = (Knowledge_impact*track_gain_per_impact);
  const track_decay_flow = (Track_record*track_decay);
  const production = (Active_projects*impact_per_project*Effective_research_time*dispersal_quality);
  const impact_decay_flow = (Knowledge_impact*impact_decay);
  const cost_escalation = (Avg_project_cost*(base_cost_inflation + concentration_cost_sensitivity*Funding_concentration));
  const collab_growth = (collab_gain*(Knowledge_impact/impact_ref)*(partner_pool/partner_ref)*(1 - Collaboration_intensity));
  const collab_decay_flow = (Collaboration_intensity*collab_decay);
  const d = {};
  d["PhD_pipeline"] = (phd_intake) - (phd_graduation);
  d["ECR_researchers"] = (ecr_recruit + initiate_intake) - (ecr_to_mcr + ecr_exit);
  d["MCR_researchers"] = (ecr_to_mcr) - (mcr_to_scr + mcr_exit);
  d["SCR_researchers"] = (mcr_to_scr) - (scr_exit);
  d["Active_projects"] = (new_grants) - (project_completion);
  d["Indigenous_researchers"] = (indig_build) - (indig_exit);
  d["Track_record"] = (track_gain) - (track_decay_flow);
  d["Knowledge_impact"] = (production) - (impact_decay_flow);
  d["Avg_project_cost"] = (cost_escalation) - (0);
  d["Collaboration_intensity"] = (collab_growth) - (collab_decay_flow);
  return d;
}

// Core stepper. opts may carry { initialStocks, start, stop } so the forward
// run can be seeded from the calibration endpoint at t0. The integrator is
// byte-identical to the checkpoint path validated in Stage 5.
function stepAll(overrides, opts) {
  opts = opts || {};
  const P = Object.assign({}, BASE_PARAMS, overrides || {});
  const dt = SIM.dt;
  const start = (opts.start !== undefined) ? opts.start : SIM.start;
  const stop = (opts.stop !== undefined) ? opts.stop : SIM.stop;
  const method = (SIM.method || "rk4").toLowerCase();
  let S = opts.initialStocks ? Object.assign({}, opts.initialStocks) : initials(P);
  const mins = {}; STOCK_NAMES.forEach(s => mins[s] = S[s]);
  const times = [];
  const series = {}; REPORT_VARS.forEach(v => series[v] = []);
  const STOCKSET = new Set(STOCK_NAMES);
  function record(tt) {
    const a = auxValues(S, P, tt);
    times.push(tt);
    REPORT_VARS.forEach(v => series[v].push(STOCKSET.has(v) ? S[v] : a[v]));
  }
  let t = start;
  const nsteps = Math.round((stop - start) / dt);
  record(start);
  for (let i = 0; i < nsteps; i++) {
    if (method === "euler") {
      const k1 = deriv(S, P, t);
      const ns = {}; STOCK_NAMES.forEach(s => ns[s] = S[s] + dt * k1[s]); S = ns;
    } else {
      const k1 = deriv(S, P, t);
      const s2 = {}; STOCK_NAMES.forEach(s => s2[s] = S[s] + 0.5 * dt * k1[s]);
      const k2 = deriv(s2, P, t + 0.5 * dt);
      const s3 = {}; STOCK_NAMES.forEach(s => s3[s] = S[s] + 0.5 * dt * k2[s]);
      const k3 = deriv(s3, P, t + 0.5 * dt);
      const s4 = {}; STOCK_NAMES.forEach(s => s4[s] = S[s] + dt * k3[s]);
      const k4 = deriv(s4, P, t + dt);
      const ns = {};
      STOCK_NAMES.forEach(s => ns[s] = S[s] + dt / 6.0 * (k1[s] + 2*k2[s] + 2*k3[s] + k4[s]));
      S = ns;
    }
    t = start + (i + 1) * dt;
    STOCK_NAMES.forEach(s => { if (S[s] < mins[s]) mins[s] = S[s]; });
    record(t);
  }
  return { times: times, series: series, finalStocks: S, mins: mins };
}

// Full time series + endpoint stock vector — for the dashboard.
function simulate(overrides, opts) { return stepAll(overrides, opts); }
function final_state(overrides, opts) { return stepAll(overrides, opts).finalStocks; }

// Checkpoint matrix — the Stage 5 validation path (numerics unchanged).
function run(overrides, checkpoints, opts) {
  const out = stepAll(overrides, opts);
  const cpset = new Set(checkpoints.map(c => c.toFixed(6)));
  const captured = {};
  out.times.forEach((tt, i) => {
    if (cpset.has(tt.toFixed(6))) {
      const row = {};
      REPORT_VARS.forEach(v => row[v] = out.series[v][i]);
      captured[tt.toFixed(6)] = row;
    }
  });
  return { checkpoints: captured, stock_mins: out.mins };
}

if (typeof require !== "undefined" && require.main === module) {
  const fs = require("fs");
  const scen = JSON.parse(fs.readFileSync(process.argv[2], "utf-8"));
  const checkpoints = scen.checkpoints || [SIM.start, SIM.stop];
  const out = { engine: "javascript", report_vars: REPORT_VARS, scenarios: {} };
  scen.scenarios.forEach(sc => { out.scenarios[sc.name] = run(sc.overrides || {}, checkpoints); });
  fs.writeFileSync(process.argv[3], JSON.stringify(out, null, 2));
  console.log("PASS: javascript twin ran " + scen.scenarios.length + " scenario(s).");
}
if (typeof module !== "undefined" && module.exports) {
  module.exports = { run, simulate, final_state, REPORT_VARS, STOCK_NAMES, SIM };
}

    var cx=svg.querySelector(".cx");
    svg.addEventListener("mousemove",function(evt){
      var r=svg.getBoundingClientRect(), px=(evt.clientX-r.left)*m.W/r.width;
      if(px<m.padL-2||px>m.W-m.padR+2){ cx.style.display="none"; tip.style.display="none"; return; }
      var xv=m.xmin+(px-m.padL)/(m.W-m.padL-m.padR)*(m.xmax-m.xmin);
      var bi=0,bd=Infinity; for(var i=0;i<m.xs.length;i++){ var d=Math.abs(m.xs[i]-xv); if(d<bd){bd=d;bi=i;} }
      var sx=m.padL+(m.xs[bi]-m.xmin)/(m.xmax-m.xmin)*(m.W-m.padL-m.padR);
      cx.setAttribute("x1",sx); cx.setAttribute("x2",sx); cx.style.display="";
      var dec=(m.ymax-m.ymin)<5?3:1;
      var h='<div class="tt">'+(calLabel(m.xs[bi])||(DASH.time_units+' '+fmt(m.xs[bi],(m.xmax-m.xmin)<5?2:1)+(state.mode==="forward"?" from today":"")))+'</div>';
      m.sers.forEach(function(s){ h+='<div class="tr"><span class="sw" style="background:'+s.color+(s.dashed?';opacity:.55':'')+'"></span>'+(s.label||"")+'<span class="tvv">'+fmt(s.ys[bi],dec)+'</span></div>'; });
      tip.innerHTML=h; tip.style.display="block";
      var pad=14, tw=tip.offsetWidth||190, lx=evt.clientX+pad;
      if(lx+tw>window.innerWidth-8) lx=evt.clientX-tw-pad;
      tip.style.left=lx+"px"; tip.style.top=(evt.clientY+pad)+"px";
    });
    svg.addEventListener("mouseleave",function(){ cx.style.display="none"; tip.style.display="none"; });
  });
}
function renderNote(){
  el("note").innerHTML = state.mode==="forward"
    ? "Forward re-anchors to today by seeding the run from the calibration\u2019s endpoint state, then runs future policy. Edit the active scenario and compare A against B."
    : "Two views, one validated engine. Validation reproduces the subject\u2019s known history; switch to Forward to drive future policy.";
}
function renderAssume(){
  el("assume").innerHTML='<h2>What this model assumes - and what it doesn\u2019t</h2>'+
    (DASH.assumptions||[]).map(function(a){ return '<p><b>'+a.title+'</b> '+a.body+'</p>'; }).join("");
}
function renderAll(){ renderModebar(); renderNote(); renderTiles(); renderConsole(); renderCharts(); }
el("kicker").textContent=DASH.kicker; el("title").textContent=DASH.title; el("sub").textContent=DASH.subtitle;
el("foot").textContent=DASH.footer; renderAssume(); renderAll();
</script>
</body></html>
