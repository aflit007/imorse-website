  d["Bridging_Primary_Temp"] = (s_off_to_bridging_temp + s_on_to_bridging_temp + graduate_to_bridging_temp + whm1_to_bridging_temp + whm2_to_bridging_temp + whm3_to_bridging_temp + skilled_to_bridging_temp + visitor_applications_temp + deferred_visitor_release_temp + onshore_temp_reapplication_temp + pandemic_lodgements_temp) - (bpt_grants_to_students + bpt_grants_to_skilled + bpt_grants_to_other_temporary + bpt_to_tribunal + bpt_to_final + bpt_withdrawals);
  d["Bridging_Primary_Perm"] = (s_off_to_bridging_perm + s_on_to_bridging_perm + graduate_to_bridging_perm + whm1_to_bridging_perm + whm2_to_bridging_perm + whm3_to_bridging_perm + skilled_to_bridging_perm + visitor_applications_perm + deferred_visitor_release_perm + onshore_temp_reapplication_perm + pandemic_lodgements_perm) - (bpp_permanent + bpp_protection_grants + bpp_to_tribunal + bpp_to_final + bpp_withdrawals);
  d["Onshore_Temporary"] = (bpt_grants_to_other_temporary + bridging_tribunal_temp_grant + bridging_court_temp_grant) - (onshore_temp_reapplication_temp + onshore_temp_reapplication_perm + onshore_temp_departures);
  d["Unlawful_Non_Citizens"] = (bridging_final_lapse) - (unlawful_departures + unlawful_removals);
  d["Pandemic_Stuck_Visitors"] = (pandemic_stranding_stayers) - (pandemic_lodgements_temp + pandemic_lodgements_perm);
  d["Pandemic_Bridging_Visitors"] = (pandemic_stranding_leavers) - (pandemic_visitor_departures);
  d["Employment"] = (net_hiring) - (0);
  d["GDP_Trend_Reference"] = (gdp_trend_update) - (0);
  d["GDPpc_Trend_Reference"] = (gdppc_trend_update) - (0);
  d["Demand_Base"] = (demand_base_update) - (0);

  d["He_Students_U"] = (he_students_in_U) - (he_students_out_U);
  d["He_Students_P"] = (he_students_in_P) - (he_students_out_P);
  d["He_Students_V"] = (he_students_in_V) - (he_students_out_V);
  d["He_Students_E"] = (he_students_in_E) - (he_students_out_E);
  d["He_Students_O"] = (he_students_in_O) - (he_students_out_O);
  d["NOSC_Rate_U"] = (nosc_update_U) - (0);
  d["NOSC_Rate_P"] = (nosc_update_P) - (0);
  d["NOSC_Rate_V"] = (nosc_update_V) - (0);
  d["SA_Scrutiny"] = (sa_scrutiny_adjust) - (0);
  d["Tuition_Income_Smoothed"] = (tuition_income_update) - (0);

  d["Arch_NOSC_A"] = (arch_nosc_update_A) - (0);
  d["Arch_Alloc_A"] = (arch_alloc_update_A) - (0);
  d["Arch_Students_B"] = (arch_enrol_B) - (arch_exit_B);
  d["Arch_NOSC_B"] = (arch_nosc_update_B) - (0);
  d["Arch_Alloc_B"] = (arch_alloc_update_B) - (0);
  d["Arch_Students_C"] = (arch_enrol_C) - (arch_exit_C);
  d["Arch_NOSC_C"] = (arch_nosc_update_C) - (0);
  d["Arch_Alloc_C"] = (arch_alloc_update_C) - (0);
  return d;
}

// Core stepper. opts may carry { initialStocks, start, stop } so the forward
// run can be seeded from the calibration endpoint at t0. The integrator is
// byte-identical to the checkpoint path validated in Stage 5.
function stepAll(overrides, opts) {
  opts = opts || {};
  const P = Object.assign({}, BASE_PARAMS, overrides || {});
  const dt = SIM.dt;
  const start = (opts.start !== undefined) ? opts.start : SIM.start;
  const stop = (opts.stop !== undefined) ? opts.stop : SIM.stop;
  const method = (SIM.method || "rk4").toLowerCase();
  let S = opts.initialStocks ? Object.assign({}, opts.initialStocks) : initials(P);
  const mins = {}; STOCK_NAMES.forEach(s => mins[s] = S[s]);
  const times = [];
  const series = {}; REPORT_VARS.forEach(v => series[v] = []);
  const STOCKSET = new Set(STOCK_NAMES);
  function record(tt) {
    const a = auxValues(S, P, tt);
    times.push(tt);
    REPORT_VARS.forEach(v => series[v].push(STOCKSET.has(v) ? S[v] : a[v]));
  }
  let t = start;
  const nsteps = Math.round((stop - start) / dt);
  record(start);
  for (let i = 0; i < nsteps; i++) {
    if (method === "euler") {
      const k1 = deriv(S, P, t);
      const ns = {}; STOCK_NAMES.forEach(s => ns[s] = S[s] + dt * k1[s]); S = ns;
    } else {
      const k1 = deriv(S, P, t);
      const s2 = {}; STOCK_NAMES.forEach(s => s2[s] = S[s] + 0.5 * dt * k1[s]);
      const k2 = deriv(s2, P, t + 0.5 * dt);
      const s3 = {}; STOCK_NAMES.forEach(s => s3[s] = S[s] + 0.5 * dt * k2[s]);
      const k3 = deriv(s3, P, t + 0.5 * dt);
      const s4 = {}; STOCK_NAMES.forEach(s => s4[s] = S[s] + dt * k3[s]);
      const k4 = deriv(s4, P, t + dt);
      const ns = {};
      STOCK_NAMES.forEach(s => ns[s] = S[s] + dt / 6.0 * (k1[s] + 2*k2[s] + 2*k3[s] + k4[s]));
      S = ns;
    }
    t = start + (i + 1) * dt;
    STOCK_NAMES.forEach(s => { if (S[s] < mins[s]) mins[s] = S[s]; });
    record(t);
  }
  return { times: times, series: series, finalStocks: S, mins: mins };
}

// Full time series + endpoint stock vector — for the dashboard.
function simulate(overrides, opts) { return stepAll(overrides, opts); }
function final_state(overrides, opts) { return stepAll(overrides, opts).finalStocks; }

// Checkpoint matrix — the Stage 5 validation path (numerics unchanged).
function run(overrides, checkpoints, opts) {
  const out = stepAll(overrides, opts);
  const cpset = new Set(checkpoints.map(c => c.toFixed(6)));
  const captured = {};
  out.times.forEach((tt, i) => {
    if (cpset.has(tt.toFixed(6))) {
      const row = {};
      REPORT_VARS.forEach(v => row[v] = out.series[v][i]);
      captured[tt.toFixed(6)] = row;
    }
  });
  return { checkpoints: captured, stock_mins: out.mins };
}

if (typeof require !== "undefined" && require.main === module) {
  const fs = require("fs");
  const scen = JSON.parse(fs.readFileSync(process.argv[2], "utf-8"));
  const checkpoints = scen.checkpoints || [SIM.start, SIM.stop];
  const out = { engine: "javascript", report_vars: REPORT_VARS, scenarios: {} };
  scen.scenarios.forEach(sc => { out.scenarios[sc.name] = run(sc.overrides || {}, checkpoints); });
  fs.writeFileSync(process.argv[3], JSON.stringify(out, null, 2));
  console.log("PASS: javascript twin ran " + scen.scenarios.length + " scenario(s).");
}
if (typeof module !== "undefined" && module.exports) {
  module.exports = { run, simulate, final_state, REPORT_VARS, STOCK_NAMES, SIM };
}

n package"}, {"param": "one_nation_legislation_passed", "label": "One Nation legislation passes", "min": 0, "max": 1, "step": 1, "unit": "switch", "description": "Adds the legislation-dependent part of One Nation's package: the end of merits appeals for refused onshore applicants. Dormant unless the One Nation package is on.", "group": "One Nation package"}, {"param": "on_net_nom_target", "label": "One Nation net NOM target (first three years)", "min": -200000, "max": 100000, "step": 10000, "unit": "persons/yr", "description": "The net overseas migration level One Nation's cap steers toward in the first three years of its rule. The announced target is zero; because reported NOM lags the flows, a target below zero is what it takes to keep the reported figure negative for three years. Dormant unless the One Nation package is on.", "group": "One Nation package"}, {"param": "on_nom_ceiling", "label": "One Nation ceiling (from July 2031)", "min": 50000, "max": 250000, "step": 10000, "unit": "persons/yr", "description": "The ceiling One Nation's cap enforces once the three net-negative years end. The announced ceiling is 130,000. Dormant unless the One Nation package is on.", "group": "One Nation package"}, {"param": "on_temp_grant_cut", "label": "One Nation cut to temporary grants", "min": 0, "max": 0.9, "step": 0.05, "unit": "share", "description": "The flat share of new temporary visa grants One Nation withholds on top of its NOM cap. Dormant unless the One Nation package is on.", "group": "One Nation package"}, {"param": "perm_planning_level", "label": "Permanent Migration Program planning level", "min": 100000, "max": 260000, "step": 5000, "unit": "persons/yr", "description": "Annual permanent places from 2024-25 (currently 185,000). Fewer places lengthen the wait for onshore applicants on a permanent pathway, who hold bridging visas while they wait.", "group": "Migration program settings", "group_head": "Migration program settings"}, {"param": "student_planning_level", "label": "International student planning level", "min": 150000, "max": 400000, "step": 5000, "unit": "persons/yr", "description": "The National Planning Level for new overseas student commencements (295,000 for 2026 and 2027), split across universities, private higher education and VET in the 2026 proportions. It sets each provider type's allocation, so it moves allocation use and the MD115 processing tiers, and each archetype's allocation; it caps offshore commencements only when demand is high.", "group": "Migration program settings"}, {"param": "whm_second_ballot", "label": "Working holiday second-year ballot places", "min": 0, "max": 90000, "step": 5000, "unit": "persons/yr", "description": "Annual places in Labor's ballot for a second working holiday year (announced at 45,000). Dormant unless the Labor package is on.", "group": "Migration program settings"}, {"param": "visitor_no_further_stay_effect", "label": "Visitor no-further-stay: share of onshore applications stopped", "min": 0, "max": 1, "step": 0.05, "unit": "share", "description": "How much of the flow of visitors applying onshore for another visa Labor's no-further-stay condition stops. Protection claims cannot be barred, which is why the evidence value is 0.8, not 1. Dormant unless the Labor package is on.", "group": "Migration program settings"}, {"param": "compliance_removal_capacity", "label": "Compliance removal capacity", "min": 11015.170831829644, "max": 71015.17083182964, "step": 2000, "unit": "persons/yr", "description": "Home Affairs' annual capacity to remove people who have no lawful status or whose final determination has gone against them (half of it is taken by character cancellations).", "group": "Migration program settings"}, {"param": "tribunal_capacity", "label": "Review tribunal decision capacity", "min": 17115.40293090853, "max": 97115.40293090853, "step": 2000, "unit": "persons/yr", "description": "The number of migration and protection reviews the tribunal (AAT, now ART) can finalise in a year at normal settings. Applicants wait on bridging visas while their review is pending.", "group": "Migration program settings"}, {"param": "student_base_demand", "label": "Underlying student visa demand", "min": 58134.64087840379, "max": 358134.6408784038, "step": 5000, "unit": "persons/yr", "description": "The calibrated strength of offshore demand for Australian student visas before refusals, fees and settings act on it. Not a policy lever: it is here to show what filling the planning level would take.", "group": "Underlying demand and housing supply", "group_head": "Underlying demand and housing supply"}, {"param": "skilled_base_demand", "label": "Underlying skilled temporary visa demand", "min": 2104.7556967747514, "max": 100104.75569677475, "step": 2000, "unit": "persons/yr", "description": "The calibrated strength of employer and applicant demand for temporary skilled visas before settings, shortages and job prospects act on it. Raising it adds workers quickly; the jobs their spending creates follow with a lag.", "group": "Underlying demand and housing supply"}, {"param": "whm_base_demand", "label": "Underlying working holiday demand", "min": 9930.086926220596, "max": 199930.0869262206, "step": 5000, "unit": "persons/yr", "description": "The calibrated strength of demand for working holiday visas before ballots, settings and job prospects act on it.", "group": "Underlying demand and housing supply"}, {"param": "base_dwelling_starts", "label": "Underlying dwelling commencements", "min": 104284.62504093768, "max": 254284.62504093768, "step": 5000, "unit": "dwellings/yr", "description": "The baseline rate of new dwelling commencements. More building raises completions, which lifts the Coalition ceiling a year later and eases rental vacancy.", "group": "Underlying demand and housing supply"}, {"param": "productivity_growth", "label": "Labour productivity growth (from today)", "min": -0.0009783512751567365, "max": 0.003994587818789184, "step": 9.945878187891842e-05, "unit": "per quarter", "description": "Growth in real output per worker from October 2026. The recent trend (2018-2026, real GDP per employed person flat) is about 0% a year and is the default; the 2026 Intergenerational Report assumes 1.2% a year (0.003 a quarter). The change starts from today's productivity level.", "group": "Economy assumptions", "group_head": "Economy assumptions"}, {"param": "natural_unemployment_rate", "label": "Structural (full-employment) unemployment rate", "min": 0.03, "max": 0.08, "step": 0.001, "unit": "share", "description": "The unemployment rate the economy settles at when demand is neither hot nor cold, anchored to the RBA's 4.6% estimate (February 2026). Not a migration lever: it moves with skills, matching and labour-market institutions.", "group": "Economy assumptions"}, {"param": "domestic_skilled_entry", "label": "Domestic entry to skilled work", "min": 324324.10679585795, "max": 1297296.4271834318, "step": 32432.410679585795, "unit": "persons/yr", "description": "People entering occupation-matched skilled work from domestic training and experience each year. Not a migration lever: it stands for training and skills policy, the domestic route to easing shortages, and acts slowly.", "group": "Economy assumptions"}, {"param": "offset_labour_share", "label": "Demand offset: jobs created by new residents", "min": 0, "max": 1, "step": 0.05, "unit": "share", "description": "An assumption, not a policy. At 1 (the default, chosen at Stage 1) new residents' spending creates jobs in step with the workers they add, after a lag; at 0 demand grows only with population.", "group": "Economy assumptions"}, {"param": "he_rule_all_cross", "label": "Upward-only rule: reading", "min": 0, "max": 1, "step": 1, "unit": "switch", "description": "How the upward-only progression rule is read. 0 (Andrew's Stage 1 reading, the default): moves down the qualification scale are cut and same-level moves between providers continue. 1: every move from a university to a private provider is cut. Dormant unless the Labor package is on.", "group": "Higher education sector", "group_head": "Higher education sector"}, {"param": "he_fee_U", "label": "University international fee", "min": 30000, "max": 60000, "step": 1000, "unit": "AUD/yr", "description": "Average annual tuition for an international student at a public university ($40,000 by default, the mid-point of the reported range). A wider gap to a private place pushes more completers down the price ladder.", "group": "Higher education sector"}, {"param": "he_fee_P", "label": "Private higher education international fee", "min": 16000, "max": 36000, "step": 1000, "unit": "AUD/yr", "description": "Average annual tuition at a private higher education provider ($24,000 by default). A narrower gap to universities means fewer moves down the price ladder.", "group": "Higher education sector"}, {"param": "he_pl2026_P", "label": "Private higher education allocation (2026 split)", "min": 20325, "max": 60325, "step": 1000, "unit": "places/yr", "description": "The other-higher-education component of the planning level (34,325 for 2026, Department of Education). Raising it gives private providers a larger share of the national level, so their allocation use falls and the MD115 tiers bite later; the national level is held, so the other types' shares fall a little.", "group": "Higher education sector"}, {"param": "he_md_loss", "label": "MD115: share of applicants lost to slower processing", "min": 0.042893692366837766, "max": 0.8428936923668378, "step": 0.05, "unit": "share", "description": "How hard the MD115 processing tiers bite: the share of offshore applicants to providers past their 80 per cent threshold who are lost to slower processing (fitted to 2025-26). Higher = a tougher processing throttle.", "group": "Higher education sector"}, {"param": "arch_fee_A", "label": "Archetype A fee (private city non-university)", "min": 14000, "max": 36000, "step": 1000, "unit": "AUD/yr", "description": "The archetype's international fee. Lower fees draw more students (held price response) but earn less each; the archetype writes nothing back into the sector or national model.", "group": "Archetype providers", "group_head": "Archetype providers"}, {"param": "arch_fee_B", "label": "Archetype B fee (mid-tier metropolitan university)", "min": 28000, "max": 60000, "step": 1000, "unit": "AUD/yr", "description": "The archetype's international fee (the university average by default). One-way: it moves only this archetype.", "group": "Archetype providers"}, {"param": "arch_fee_C", "label": "Archetype C fee (domestic-focused specialist)", "min": 12000, "max": 34000, "step": 1000, "unit": "AUD/yr", "description": "The archetype's international fee. One-way: it moves only this archetype.", "group": "Archetype providers"}], "presets": [{"name": "Current settings", "levers": {}, "description": "Baseline - no party package. Reported NOM moves from about 293,000 in the year to June 2027 to about 265,000 by May 2034, while bridging holders keep rising. Economy: unemployment 4.3% in June 2028 and 5.0% by May 2034; per-capita growth 0.2% a year by May 2034 at recent-trend productivity. Higher education: university and private higher education allocation use about 40% and 49% by May 2034 (people, not course enrolments); archetype revenue 64%, 70% and 57% of 2025 (A, B, C) as commencements drift down (university commencements about 68,000 a year by May 2034 against 75,000 in 2026-27)."}, {"name": "Budget path: Labor package", "levers": {"labor_package_on": 1}, "description": "Labor's September 2026 package. Reported NOM is about 228,000 in 2026-27 and 174,000 in 2027-28 (below the Budget path's 245,000 and 225,000 in both years), and about 212,000 by May 2034. The upward-only rule cuts the hop down the price ladder from about 3,000 a year to about 140 in 2027-28. Refusal rates fall over the period (South Asian refusals 14% by May 2034 against 51% at baseline), so the sector grows: archetype revenue by May 2034 is 102%, 88% and 108% of 2025 (A, B, C)."}, {"name": "Coalition rule as announced", "levers": {"coalition_package_on": 1}, "description": "Coalition rule at one person per completed dwelling from July 2028. Reported NOM is about 169,000 in 2029-30 and 188,000 to 194,000 from 2030-31 to May 2034, against a ceiling near 186,000. The cut to student grants shrinks the sector: university commencements about 51,000 a year by May 2034 against 68,000 at baseline; archetype B's revenue 53% of 2025."}, {"name": "Coalition below 170,000", "levers": {"coalition_package_on": 1, "coalition_persons_per_dwelling": 0.8}, "description": "A tighter ceiling than the announced rule: 0.8 persons per dwelling (about 149,000 at current completions). Reported NOM is about 128,000 in 2029-30 and 154,000 to 162,000 from 2030-31 to May 2034: below 170,000 throughout."}, {"name": "One Nation as announced", "levers": {"one_nation_package_on": 1}, "description": "One Nation's package without its legislation. Reported NOM is negative in 1 year-ending reading (about -13,000 in 2029-30); the promise is three years. Temporary holders fall by about 579,000 from June 2028 to June 2031, against the 750,000 promised. NOM then runs 108,000 to 160,000 from 2031-32 to May 2034. The student cap and refusals take university commencements to about 27,000 a year in 2030-31; archetype revenue by May 2034 50%, 43% and 47% of 2025."}, {"name": "One Nation: three years net negative", "levers": {"one_nation_package_on": 1, "one_nation_legislation_passed": 1, "on_net_nom_target": -100000, "on_nom_ceiling": 100000}, "description": "With the appeals legislation, a target of -100,000 and a 100,000 ceiling. Reported NOM is negative in 3 year-ending readings (about -20,000 in 2028-29, about -100,000 in 2029-30, about -60,000 in 2030-31); the promise is three years. Temporary holders fall by about 862,000 from June 2028 to June 2031, against the 750,000 promised. NOM then runs 81,000 to 142,000 from 2031-32 to May 2034. The student cap and refusals take university commencements to about 14,000 a year in 2030-31; archetype revenue by May 2034 47%, 40% and 45% of 2025."}, {"name": "Sector: planning level filled", "levers": {"labor_package_on": 1, "student_base_demand": 318134.6408784038}, "description": "What filling the 295,000 planning level takes under Labor's package: underlying student demand about 2.4 times the calibrated level. University and private higher education allocation use reach about 87% and 100% by May 2034 (the MD115 slower tiers start to bite: 8.2% of university applicants slowed); all three archetypes sit near their 80 per cent line (80%, 81%, 81%) and above 2025 revenue. Reported NOM runs about 271,000 to 278,000 from 2027-28 to 2030-31."}, {"name": "Sector: upward-only rule, strict reading", "levers": {"labor_package_on": 1, "he_rule_all_cross": 1}, "description": "Labor's package with every cross-provider move cut, not only moves down the qualification scale (the reading not adopted at Stage 1). The hop down falls to about 0 a year in 2027-28 against 140 under the same-level-allowed reading, and private higher education commencements by May 2034 change by about 204 a year (fewer). Under Labor's package the hop is already small, so the reading matters little."}, {"name": "Sector: wider price ladder", "levers": {"he_fee_U": 48000}, "description": "University fees $8,000 a year higher (the gap to a private place widens by a half). The hop down rises to about 5,000 a year in 2027-28 against 3,000 at baseline; the elasticity behind it is a held default (Stage 4), so read this as direction, not size."}, {"name": "Archetype A: fee cut", "levers": {"arch_fee_A": 19000.0}, "description": "Archetype A (a private city non-university provider) cuts its fee from $24,000 to $19,000. Its allocation use rises from 54% to 64% in June 2028, but revenue by May 2034 is 63% of 2025 against 64% without the cut: about the same, because at the held price response (each 1% off the fee brings about 1% more students) the extra students make up the lower fee and no more. A fee cut buys allocation use, not revenue. Nothing else in the model moves."}, {"name": "Ambition: per-capita growth 1.1% (IGR productivity)", "levers": {"productivity_growth": 0.003}, "description": "Per-capita growth is set by productivity, not by migration settings. At the Intergenerational Report's 1.2% a year labour productivity (0.003 a quarter) per-capita growth is 1.4% by May 2034, at or above the 1.1% ambition from 2027; at the recent trend it is 0.2%. The change starts from today's productivity level."}, {"name": "Worker intake +50%", "levers": {"skilled_base_demand": 46104.75569677475, "whm_base_demand": 134930.0869262206}, "description": "Skilled temporary and working holiday demand about 50% higher. Unemployment runs up to 0.25 points above baseline in the first years, then the lagged demand offset narrows the gap (+0.09 points by May 2034). Reported NOM is about 333,000 in 2027-28 against 288,000 at baseline."}, {"name": "Sensitivity: demand follows population", "levers": {"offset_labour_share": 0.0}, "description": "Not a policy: a test of the full-offset assumption chosen at Stage 1. If new residents' spending created jobs in line with population rather than with the workers they add, unemployment would be 8.4% in 2030 and 9.6% by May 2034."}, {"name": "Ambition: full employment (4.6%)", "levers": {"natural_unemployment_rate": 0.041}, "description": "No migration setting holds unemployment at the RBA's 4.6% estimate: under current settings the model's rate is 5.0% by May 2034. Holding it at or below 4.6% to May 2034 needs the structural rate itself at 4.1% (better matching and skills, outside migration policy): unemployment 4.0% in June 2028 and 4.5% by May 2034."}, {"name": "Ambition: shortages eased to 19%", "levers": {"domestic_skilled_entry": 810810.2669896448}, "description": "Easing shortages to 19% of occupations (the 2021 level) takes about 25% more people entering skilled work from domestic training each year - roughly 162,000 more a year. The share is at or below 19% from 2031 and 17% by May 2034, against 26% at baseline."}], "var_glossary": {"Reported_NOM": "Net overseas migration as the ABS reports it: arrivals minus departures of people who stay or leave for 12 of 16 months, as a year-ending figure. It lags the underlying flows by about two quarters.", "coalition_nom_cap": "The Coalition ceiling: the prior year's dwelling completions times the persons-per-dwelling setting. It is always drawn, but it only binds when the Coalition rule is on.", "nom_students": "Net overseas migration of student visa holders and their dependants, annualised.", "nom_working_holiday": "Net overseas migration of working holiday makers, annualised.", "nom_skilled_temporary": "Net overseas migration of temporary skilled visa holders (subclass 457/482 and successors) and their families, annualised.", "nom_bridging": "Net overseas migration from visitors and others who apply onshore and stay on bridging visas, less those who leave or are removed, annualised.", "student_holders": "Student visa holders in Australia and offshore awaiting arrival, including dependants.", "whm_population": "Working holiday makers in their first, second or third visa year.", "Skilled_Temporary": "Temporary skilled visa holders, primary and secondary. The model runs about 25% below the record at March 2026.", "Graduates": "Temporary graduate (subclass 485) visa holders.", "bridging_population": "Everyone on a bridging visa: primary applications pending, tribunal and court review, and people finally determined but not yet departed. Read its 2036 level as a direction and a range, not a point: the sensitivity sweep moves it by 100,000 to 300,000.", "Bridging_Tribunal": "Bridging visa holders whose refusal is under review at the tribunal.", "Unlawful_Non_Citizens": "People in Australia without a valid visa, anchored to Home Affairs' 30 June estimates.", "student_arrival_rate": "New international student visa arrivals each quarter after refusals, fees, caps and settings.", "Cap_Cut": "The share of new student, working holiday and skilled temporary grants withheld to hold NOM under a party's cap. Zero unless the Coalition or One Nation rule is on.", "rental_vacancy_rate": "Share of the rental stock vacant, the SQM-style measure. Around 1% signals a very tight market; 3% is usually read as balanced.", "temporary_population": "All temporary visa holders counted in the model: students and dependants, graduates, working holiday makers, skilled temporary, bridging and other onshore temporary holders.", "unemployment_rate": "Unemployed people as a share of the labour force (ABS Labour Force, seasonally adjusted).", "gdp_per_capita_growth": "Growth in real GDP per person, as a smoothed annual rate.", "real_gdp_growth": "Growth in total real GDP, as a smoothed annual rate.", "occupations_in_shortage_share": "Share of assessed occupations in shortage (Jobs and Skills Australia): 19% in 2021, 36% in 2023, 29% in 2025.", "labour_force": "People aged 15 and over who are working or looking for work (ABS Labour Force).", "Employment": "Employed people (ABS Labour Force).", "gdp_per_capita": "Real GDP per person, chain volume, annualised (ABS National Accounts).", "real_gdp_annual_bn": "Total real GDP, chain volume, annualised, in $ billion (ABS National Accounts).", "vacancies_per_unemployed": "Job vacancies per unemployed person (ABS): how tight the labour market is.", "he_hop_down": "Completing students who move onshore to a cheaper provider type (university to private or VET, private to VET), shown a year.", "Mkt_Share_S": "Share of offshore student visa applications from South Asia (India, Nepal, Bangladesh, Pakistan, Sri Lanka).", "Mkt_Share_CN": "Share of offshore student visa applications from China.", "he_mref_S": "Share of South Asian offshore student visa applications refused (all provider types).", "he_mref_CN": "Share of Chinese offshore student visa applications refused.", "he_mref_R": "Share of offshore student visa applications from the rest of the world refused.", "he_tuition_income_bn": "International tuition income across all provider types, in $ billion a year (fees x students enrolled).", "he_commencements_annual_U": "International students commencing at public universities: new arrivals, onshore entrants and progressions, a year (people; the Department of Education counts course commencements, which is higher).", "He_Students_U": "International students on a student visa in Australia studying at public universities.", "he_commencements_annual_P": "International students commencing at private higher education (private universities and non-university providers): new arrivals, onshore entrants and progressions, a year (people; the Department of Education counts course commencements, which is higher).", "He_Students_P": "International students on a student visa in Australia studying at private higher education (private universities and non-university providers).", "he_commencements_annual_V": "International students commencing at VET (TAFE and private colleges): new arrivals, onshore entrants and progressions, a year (people; the Department of Education counts course commencements, which is higher).", "He_Students_V": "International students on a student visa in Australia studying at VET (TAFE and private colleges).", "he_commencements_annual_E": "International students commencing at English-language colleges (ELICOS): new arrivals, onshore entrants and progressions, a year (people; the Department of Education counts course commencements, which is higher).", "He_Students_E": "International students on a student visa in Australia studying at English-language colleges (ELICOS).", "he_commencements_annual_O": "International students commencing at schools and non-award courses: new arrivals, onshore entrants and progressions, a year (people; the Department of Education counts course commencements, which is higher).", "He_Students_O": "International students on a student visa in Australia studying at schools and non-award courses.", "he_use_U": "Allocation use at public universities: the 12-month rate of new overseas student commencements (offshore arrivals and onshore moves) over the type's share of the planning level. Allocations began in 2025; before then the line reads the rate against the 2025 level, for reference only.", "he_use_P": "Allocation use at private higher education (private universities and non-university providers): the 12-month rate of new overseas student commencements (offshore arrivals and onshore moves) over the type's share of the planning level. Allocations began in 2025; before then the line reads the rate against the 2025 level, for reference only.", "he_use_V": "Allocation use at VET (TAFE and private colleges): the 12-month rate of new overseas student commencements (offshore arrivals and onshore moves) over the type's share of the planning level. Allocations began in 2025; before then the line reads the rate against the 2025 level, for reference only.", "arch_use_A": "Archetype A, a private city non-university provider relying on international students: 12-month commencements over its allocation (MD115 reads this).", "arch_revenue_index_A": "Archetype A, a private city non-university provider relying on international students: international tuition revenue as a share of its 2025 level.", "arch_comm_annual_A": "Archetype A, a private city non-university provider relying on international students: international commencements, 12-month rate.", "Arch_Alloc_A": "Archetype A, a private city non-university provider relying on international students: its allocation of new overseas student commencements (2025 and 2026 fact sheets, scaled with the planning level; from 2027 it moves with the archetype's use).", "arch_use_B": "Archetype B, a mid-tier metropolitan university: 12-month commencements over its allocation (MD115 reads this).", "arch_revenue_index_B": "Archetype B, a mid-tier metropolitan university: international tuition revenue as a share of its 2025 level.", "arch_comm_annual_B": "Archetype B, a mid-tier metropolitan university: international commencements, 12-month rate.", "Arch_Alloc_B": "Archetype B, a mid-tier metropolitan university: its allocation of new overseas student commencements (2025 and 2026 fact sheets, scaled with the planning level; from 2027 it moves with the archetype's use).", "arch_use_C": "Archetype C, a domestic-focused specialist private provider: 12-month commencements over its allocation (MD115 reads this).", "arch_revenue_index_C": "Archetype C, a domestic-focused specialist private provider: international tuition revenue as a share of its 2025 level.", "arch_comm_annual_C": "Archetype C, a domestic-focused specialist private provider: international commencements, 12-month rate.", "Arch_Alloc_C": "Archetype C, a domestic-focused specialist private provider: its allocation of new overseas student commencements (2025 and 2026 fact sheets, scaled with the planning level; from 2027 it moves with the archetype's use)."}, "scales": {"labor_package_on": "0 = off, 1 = on. A switch, not a strength setting.", "labor_legislation_passed": "0 = legislation fails, 1 = it passes.", "coalition_package_on": "0 = off, 1 = on.", "one_nation_package_on": "0 = off, 1 = on.", "one_nation_legislation_passed": "0 = legislation fails, 1 = it passes.", "on_temp_grant_cut": "0 = no extra cut, 1 = every temporary grant withheld; 0.25 = one in four withheld. Higher = tighter.", "visitor_no_further_stay_effect": "0 = no onshore visitor applications stopped, 1 = all stopped; 0.8 = 80% stopped. Higher = tighter.", "Cap_Cut": "Shown in per cent: 30 = 30% of new temporary grants withheld. Higher = tighter.", "rental_vacancy_rate": "Shown in per cent: 1 = 1% of rental dwellings vacant. Higher = looser market.", "unemployment_rate": "Shown in per cent: 4.6 = 4.6% of the labour force unemployed. Higher = more slack.", "occupations_in_shortage_share": "Shown in per cent: 19 = 19% of assessed occupations in shortage. Higher = more shortages.", "vacancies_per_unemployed": "0.5 = one vacancy for every two unemployed people; 1 = one each. Higher = tighter.", "natural_unemployment_rate": "A share: 0.046 = 4.6% unemployed at full employment. Lower = better matching.", "offset_labour_share": "0 = new residents' spending creates jobs only in line with population; 1 = in line with the workers they add. Higher = more of the new workers' jobs created by the demand they bring.", "productivity_growth": "Per quarter: 0.00002 = about 0% a year (recent trend); 0.003 = 1.2% a year (IGR 2026). Higher = faster.", "he_rule_all_cross": "0 = same-level moves between providers continue (default); 1 = every university-to-private move cut.", "he_md_loss": "A share: 0.3 = 30% of applicants to providers past 80% of allocation lost to slower processing. Higher = tougher.", "Mkt_Share_S": "Shown in per cent: 30 = 30% of offshore applications. Higher = a larger South Asian share.", "Mkt_Share_CN": "Shown in per cent: 30 = 30% of offshore applications. Higher = a larger Chinese share.", "he_mref_S": "Shown in per cent: 40 = 40% of applications refused. Higher = tighter.", "he_mref_CN": "Shown in per cent: 5 = 5% of applications refused. Higher = tighter.", "he_mref_R": "Shown in per cent: 20 = 20% of applications refused. Higher = tighter.", "he_use_U": "Shown in per cent: 80 = commencements at 80% of the type's allocation (MD115 priority 2 begins for providers past it); 100 = at the allocation. Higher = closer to the cap.", "he_use_P": "Shown in per cent: 80 = commencements at 80% of the type's allocation (MD115 priority 2 begins for providers past it); 100 = at the allocation. Higher = closer to the cap.", "he_use_V": "Shown in per cent: 80 = commencements at 80% of the type's allocation (MD115 priority 2 begins for providers past it   st.textContent="#chartTip .ttbody{max-width:250px;line-height:1.4;white-space:normal}#chartTip .ttscale{margin-top:5px;color:var(--mute);font-size:11px}";
  (document.head||document.documentElement).appendChild(st); })();
function pubLine(t,run){ var o=(DASH.observed||{})[t.var]; if(!o||!o.pts.length) return "";
  var p=o.pts[o.pts.length-1], i=idxAt(run,p[0]); if(i<0) return ""; var m=(t.display_mult||1), k=o.mult*m;
  return '<div class="tp">Published '+fmt(p[1]*k,t.decimals)+' ('+obsDate(p[0])+') - model '+fmt(run.series[o.src][i]*k,t.decimals)+'</div>'; }
function renderTiles(){
  var fwd=state.mode==="forward";var run=fwd?computeForward(state[state.active]):computeBackcast({});
  var idx=run.times.length-1;
  if(!fwd){ var best=Infinity; for(var i=0;i<run.times.length;i++){ var d=Math.abs(run.times[i]-T0); if(d<best){best=d; idx=i;} } }
  var yr=DASH.calendar?calLabel(run.times[idx]):(""+Math.round(run.times[idx]));
  var when=fwd?("Scenario "+state.active+" \u00b7 at end of forward period ("+(DASH.forward_end_label||("+"+DASH.forward_horizon+" "+DASH.time_units+(DASH.forward_horizon==1?"":"s")))+")"):("as at "+yr+" (end of backcast)");
  el("tiles").innerHTML=(DASH.tiles||[]).map(function(t){
    var arr=run.series[t.var]; var v=arr?arr[idx]*(t.display_mult||1):NaN; var pub=fwd?"":pubLine(t,run);
    return '<div class="tile" data-tv="'+t.var+'"><div class="tl">'+t.label+(t.unit?' ('+t.unit+')':'')+'</div><div class="tv">'+fmt(v,t.decimals)+'</div><div class="tw">'+when+'</div>'+pub+'</div>'; }).join("");
  attachTileHover();
}
function attachTileHover(){
  var tip=el("chartTip");
  if(!tip){ tip=document.createElement("div"); tip.id="chartTip"; document.body.appendChild(tip); }
  Array.prototype.forEach.call(document.querySelectorAll(".tile[data-tv]"),function(tl){
    var tv=tl.getAttribute("data-tv"); var desc=VARGLOSS[tv]||""; var sc=(DASH.scales||{})[tv]||""; if(!desc&&!sc){ return; }
    tl.addEventListener("mousemove",function(evt){
      tip.innerHTML='<div class="ttbody">'+desc+(sc?'<div class="ttscale">Reading the value: '+sc+'</div>':'')+'</div>'; tip.style.display="block";
      var pad=14, tw=tip.offsetWidth||220, lx=evt.clientX+pad;
      if(lx+tw>window.innerWidth-8){ lx=evt.clientX-tw-pad; }
      tip.style.left=lx+"px"; tip.style.top=(evt.clientY+pad)+"px";
    });
    tl.addEventListener("mouseleave",function(){ tip.style.display="none"; });
  });
}

function renderConsole(){
  if(state.mode!=="forward"){ el("console").innerHTML='<div class="locked"><b>Validation view.</b> This run is locked: it reproduces the subject\u2019s known history to earn trust before any forecast. Switch to <b>Forward</b> to drive future policy.</div>'+glossVars(); return; }
  var h='<div class="abtoggle">'+["A","B"].map(function(w){ var on=state.active===w;
      return '<button class="abbtn" data-w="'+w+'" style="'+(on?'background:'+COL[w]+';color:#fff;border-color:'+COL[w]:'')+'">Scenario '+w+'</button>'; }).join("")+
      '<button class="abbtn" id="resetbtn" style="margin-left:auto;color:'+MUTE+'" title="Return every lever in scenario '+state.active+' to its baseline value">Reset '+state.active+' to baseline</button></div>';
  if(DASH.presets&&DASH.presets.length){
    h+='<div style="margin:12px 0 4px"><div style="font-weight:600;margin-bottom:5px">Preset scenarios</div>'+
      DASH.presets.map(function(p,pi){ return '<button class="presetbtn" data-pi="'+pi+'" title="'+String(p.description||"").replace(/"/g,"&quot;")+'" style="margin:0 6px 6px 0;padding:5px 10px;border:1px solid '+MUTE+';border-radius:6px;background:#fff;cursor:pointer;font:inherit">'+p.name+'</button>'; }).join("")+
      '<div style="font-size:11px;color:'+MUTE+'">One click sets the levers in Scenario '+state.active+'; the button stays dark while those values hold, and turns grey if you change any.</div></div>';
  }
  (DASH.controls||[]).forEach(function(c){ var val=state[state.active][c.param];
    h+=(c.group_head?'<div class="cgrp">'+c.group_head+'</div>':'')+'<div class="srow"><div class="slab"><span'+(c.description?' title="'+String(c.description).replace(/"/g,'&quot;')+'"':'')+'>'+c.label+'</span><span class="sval" data-k="'+c.param+'" style="color:'+COL[state.active]+'">'+nv(val)+(c.unit?' '+c.unit:'')+'</span></div>'+
       '<input type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+val+'" data-k="'+c.param+'"></div>'; });
  h+='<div class="gloss"><h3>What the levers mean</h3>'+(DASH.controls||[]).map(function(c){
    var g=c.description||""; var base=DASH.base[c.param]; var sc=(DASH.scales||{})[c.param];
    return (c.group_head?'<div class="gch">'+c.group_head+'</div>':'')+'<div class="gi"><b>'+c.label+'</b>'+g+' <span class="gr">Range '+nv(c.min)+' to '+nv(c.max)+(c.unit?' '+c.unit:'')+' \u00b7 baseline '+nv(base)+'.</span>'+(sc?' <span class="gr">Scale: '+sc+'</span>':'')+'</div>'; }).join("")+'</div>';
  h+=glossVars();
  el("console").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.abbtn'),function(b){ b.onclick=function(){ state.active=b.getAttribute('data-w'); renderAll(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('.presetbtn'),function(b){ b.onclick=function(){
    var p=DASH.presets[+b.getAttribute('data-pi')]||{}, t=state[state.active], lv=p.levers||{};
    for(var bk in DASH.base){ t[bk]=DASH.base[bk]; }
    (DASH.controls||[]).forEach(function(c){ if(lv[c.param]!==undefined){
      var v=lv[c.param]; if(v<c.min)v=c.min; if(v>c.max)v=c.max; t[c.param]=v; } });
    state.selectedPreset[state.active]=+b.getAttribute('data-pi');
    renderAll(); }; });
  Array.prototype.forEach.call(el("console").querySelectorAll('input[type=range]'),function(inp){
    inp.oninput=function(){ var k=inp.getAttribute('data-k'), v=parseFloat(inp.value);
      state[state.active][k]=v;
      var sv=el("console").querySelector('.sval[data-k="'+k+'"]');
      if(sv) sv.textContent=nv(v)+(CUNIT[k]?' '+CUNIT[k]:'');
      stylePresetBtns(); renderTiles(); renderCharts(); }; });
  var rb=el("resetbtn");
  if(rb) rb.onclick=function(){ var t=state[state.active];
    for(var k in DASH.base) t[k]=DASH.base[k]; state.selectedPreset[state.active]=undefined; renderAll(); };
  stylePresetBtns();
}
function escA(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
document.addEventListener("click",function(e){ var a=e.target&&e.target.closest?e.target.closest("a[data-gl]"):null; if(!a) return;
  e.preventDefault(); var t=el(a.getAttribute("data-gl")); if(!t) return;
  t.scrollIntoView({behavior:"smooth",block:"center"}); t.classList.remove("glhi"); void t.offsetWidth; t.classList.add("glhi"); });
function renderCharts(){
  var html="", tot={n:0,ok:0};
  CHARTMETA=[];
  function key(ch,ci){ return ch.vars.map(function(v,vi){ var L=lab(ch,v,vi), g=VARGLOSS[v];
      return '<a class="ki" href="#" data-gl="gl-'+ci+'-'+vi+'" title="'+escA(L+(g?': '+g:'')+' (click for the glossary entry)')+'"><span class="ksw" style="background:'+VARCOL[vi%VARCOL.length]+'"></span>'+L+'</a>'; }).join(""); }
  function lab(ch,v,vi){ return (ch.labels&&ch.labels[vi])||v; }
  function mul(ch){ return ch.display_mult||1; }
  function sc(a,m){ return m===1?a:a.map(function(y){ return y*m; }); }
  function exOf(ch,run){ var m=mul(ch), ex={refs:[],obs:[],yext:[],n:0,ok:0,yfloor:ch.y_floor};
    (ch.refs||[]).forEach(function(r){ ex.refs.push({y:r.value*m,label:r.label}); ex.yext.push(r.value*m); });
    (ch.y_include||[]).forEach(function(y){ ex.yext.push(y); });
    if(run){ ch.vars.forEach(function(v,vi){ var o=(DASH.observed||{})[v]; if(!o) return; var src=run.series[o.src]; if(!src) return;
      o.pts.forEach(function(p){ var i=idxAt(run,p[0]); if(i<0) return; var ok=Math.abs(src[i]-p[1])<=p[2], k=o.mult*m;
        ex.n++; if(ok) ex.ok++;
        ex.obs.push({x:p[0],y:p[1]*k,lo:(p[1]-p[2])*k,hi:(p[1]+p[2])*k,ok:ok,color:VARCOL[vi%VARCOL.length]});
        ex.yext.push((p[1]-p[2])*k); ex.yext.push((p[1]+p[2])*k); }); }); }
    return ex; }
  function evKey(){ return (DASH.event_lines&&DASH.event_lines.length)?'<span class="ki" style="color:#7A4A8C"><span class="ksw" style="background:repeating-linear-gradient(90deg,#7A4A8C 0 6px,transparent 6px 9px)"></span>'+(DASH.event_lines_legend||'event lines')+'</span>':''; }
  function refKey(ch){ return evKey()+((ch.refs&&ch.refs.length)?'<span class="ki" style="color:#3F6B2C"><span class="ksw" style="background:repeating-linear-gradient(90deg,#55803E 0 2px,transparent 2px 5px)"></span>dotted green line = '+ch.refs.map(function(r){return r.label;}).join('; ')+'</span>':''); }
  if(state.mode==="forward"){
    var A=computeForward(state.A), Bv=computeForward(state.B), xs=xAxis(A);
    (DASH.charts||[]).forEach(function(ch,ci){ var m=mul(ch);
      var sers=[]; ch.vars.forEach(function(v,vi){ var c=VARCOL[vi%VARCOL.length];
        sers.push({ys:sc(A.series[v],m),color:c,dashed:false,label:lab(ch,v,vi)+" - A"});
        sers.push({ys:sc(Bv.series[v],m),color:c,dashed:true,label:lab(ch,v,vi)+" - B"}); });
      html+='<div class="card" id="ch-'+ci+'"><div class="ctitle" data-n="'+(ci+1)+'">'+ch.title+'</div>'+chartSVG(xs,sers,ch.y_label,ch.invert_y,ci,exOf(ch,null))+
            '<div class="legend">'+key(ch,ci)+refKey(ch)+'<span class="ki" style="color:'+MUTE+'">solid = Scenario A &nbsp;·&nbsp; dashed = Scenario B</span></div></div>';
    });
  } else {
    var C=computeBackcast({}), xs=xAxis(C);
    (DASH.charts||[]).forEach(function(ch,ci){ var m=mul(ch), ex=exOf(ch,C);
      tot.n+=ex.n; tot.ok+=ex.ok;
      var sers=ch.vars.map(function(v,vi){ return {ys:sc(C.series[v],m),color:VARCOL[vi%VARCOL.length],dashed:false,label:lab(ch,v,vi)}; });
      var score=ex.n?('<div class="vscore">Published data: <b>'+ex.ok+' of '+ex.n+'</b> points within the pre-declared tolerance.</div>')
                    :'<div class="vscore">No published series on this chart: not scored.</div>';
      var lim=(ex.n>ex.ok&&ch.validation_note)?'<div class="vlim"><b>Limitation.</b> '+ch.validation_note+'</div>':'';
      html+='<div class="card" id="ch-'+ci+'"><div class="ctitle" data-n="'+(ci+1)+'">'+ch.title+'</div>'+chartSVG(xs,sers,ch.y_label,ch.invert_y,ci,ex)+
            '<div class="legend">'+key(ch,ci)+refKey(ch)+'<span class="ki" style="color:'+MUTE+'">Calibration backcast - reproduces history; dashed vertical line = calibration anchor'+
            (ex.n?'; dots = published data (open = outside tolerance), bars = tolerance':'')+'</span></div>'+score+lim+'</div>';
    });
  }
  el("charts").innerHTML=html;
  var vs=el("vsum"); if(vs) vs.innerHTML=tot.n?(' On these charts <b>'+tot.ok+' of '+tot.n+'</b> published points are within tolerance.'):'';
  attachHover();
}
function attachHover(){
  var tip=el("chartTip");
  if(!tip){ tip=document.createElement("div"); tip.id="chartTip"; document.body.appendChild(tip); }
  Array.prototype.forEach.call(document.querySelectorAll("svg.chsvg"),function(svg){
    var ci=parseInt(svg.getAttribute("data-ci"),10), m=CHARTMETA[ci]; if(!m)return;
    var cx=svg.querySelector(".cx");
    svg.addEventListener("mousemove",function(evt){
      var r=svg.getBoundingClientRect(), px=(evt.clientX-r.left)*m.W/r.width;
      if(px<m.padL-2||px>m.W-m.padR+2){ cx.style.display="none"; tip.style.display="none"; return; }
      var xv=m.xmin+(px-m.padL)/(m.W-m.padL-m.padR)*(m.xmax-m.xmin);
      var bi=0,bd=Infinity; for(var i=0;i<m.xs.length;i++){ var d=Math.abs(m.xs[i]-xv); if(d<bd){bd=d;bi=i;} }
      var sx=m.padL+(m.xs[bi]-m.xmin)/(m.xmax-m.xmin)*(m.W-m.padL-m.padR);
      cx.setAttribute("x1",sx); cx.setAttribute("x2",sx); cx.style.display="";
      var dec=(m.ymax-m.ymin)<5?3:1;
      var h='<div class="tt">'+((DASH.calendar?obsDay((state.mode==="forward"?T0:0)+m.xs[bi]):null)||(DASH.time_units+' '+fmt(m.xs[bi],(m.xmax-m.xmin)<5?2:1)+(state.mode==="forward"?" from today":"")))+'</div>';
      m.sers.forEach(function(s){ h+='<div class="tr"><span class="sw" style="background:'+s.color+(s.dashed?';opacity:.55':'')+'"></span>'+(s.label||"")+'<span class="tvv">'+(Math.abs(s.ys[bi])>=1000?fmt(s.ys[bi],0):fmt(s.ys[bi],dec))+'</span></div>'; });
      tip.innerHTML=h; tip.style.display="block";
      var pad=14, tw=tip.offsetWidth||190, lx=evt.clientX+pad;
      if(lx+tw>window.innerWidth-8) lx=evt.clientX-tw-pad;
      tip.style.left=lx+"px"; tip.style.top=(evt.clientY+pad)+"px";
    });
    svg.addEventListener("mouseleave",function(){ cx.style.display="none"; tip.style.display="none"; });
  });
}
function renderNote(){
  el("note").innerHTML = state.mode==="forward"
    ? "Forward re-anchors to today by seeding the run from the calibration\u2019s endpoint state, then runs future policy. Edit the active scenario and compare A against B."
    : "Two views, one validated engine. Validation reproduces the subject\u2019s known history; switch to Forward to drive future policy. "+(DASH.validation_summary||"")+'<span id="vsum"></span>';
}
function renderAssume(){
  el("assume").innerHTML='<h2>What this model assumes - and what it doesn\u2019t</h2>'+
    (DASH.assumptions||[]).map(function(a){ return '<p><b>'+a.title+'</b> '+a.body+'</p>'; }).join("");
}
function renderAll(){ renderModebar(); renderNote(); renderTiles(); renderConsole(); renderCharts(); }
el("kicker").textContent=DASH.kicker; el("title").textContent=DASH.title; el("sub").textContent=DASH.subtitle;
el("foot").textContent=DASH.footer; renderAssume(); renderAll();
</script>
